# Builds and publishes the Windows release: the Go cores (bpbcore, psiphon), the Flutter
# Windows app, the bundled Tor/Wintun/geo assets, the Inno Setup installer and a portable
# zip. Run it manually from the Actions tab, or push a tag like v1.3.2.
#
# The release assets:
#   bpb-<version>-windows-x64.zip     (portable)
#   bpb-<version>-windows-x64.exe     (the Setup installer)
#   SHA256SUMS.txt
name: Windows Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      TOR_VERSION: 16.0.3
      TOR_SHA256: b70cabe2b93b5b1fd144466e42afaabe7a1a470228912657b3b5776e9cb7a9f1
      WINTUN_VERSION: 0.14.1
      WINTUN_DLL_SHA256: e5da8447dc2c320edc0fc52fa01885c103de8c118481f683643cacc3220dafce
      FLUTTER_VERSION: '3.47.7'
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from pubspec.yaml
        run: |
          version=$(sed -n 's/^version: *\([^-+]*\).*/\1/p' pubspec.yaml | tr -d '[:space:]')
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Could not read an x.y.z version from pubspec.yaml (got '$version')"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Build the cores (bpbcore, psiphon)
        run: |
          cd core
          GOOS=windows GOARCH=amd64 go build -trimpath -buildvcs=false \
            -ldflags "-s -w -buildid= -checklinkname=0 -X bpb/core/cmd/bpbcore.bakedAppVersion=$VERSION" \
            -o build/bpbcore.exe ./cmd/bpbcore
          cd ../psiphon
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 GOTOOLCHAIN=go1.26.10 \
            go build -trimpath -buildvcs=false -ldflags "-s -w -buildid= -checklinkname=0" \
            -o ../core/build/psiphon.exe .
          ../core/build/bpbcore.exe version

      - name: Wintun (the TUN driver, hash-checked)
        run: |
          curl -fsSL -o wintun.zip "https://www.wintun.net/builds/wintun-$WINTUN_VERSION.zip"
          unzip -q wintun.zip "wintun/bin/amd64/wintun.dll"
          echo "$WINTUN_DLL_SHA256  wintun/bin/amd64/wintun.dll" | sha256sum -c --quiet -

      - name: Tor expert bundle (tor + lyrebird, hash-checked)
        run: |
          file="tor-expert-bundle-windows-x86_64-$TOR_VERSION.tar.gz"
          curl -fsSL -o "$file" "https://dist.torproject.org/torbrowser/$TOR_VERSION/$file"
          echo "$TOR_SHA256  $file" | sha256sum -c --quiet -
          mkdir tor-bundle && tar -xzf "$file" -C tor-bundle

      - name: Geo assets (Xray's routing data)
        run: bash scripts/fetch_geo.sh

      - name: Tor bridges for the setup wizard
        run: bash scripts/fetch_tor_bridges.sh

      - name: The worker's minified script (a Flutter asset)
        run: |
          cd worker
          npm install --no-audit --no-fund
          npm run minify

      - name: Flutter tests
        run: flutter test

      - name: Build the Windows app
        run: flutter build windows --release

      - name: Assemble the portable bundle
        run: |
          out=build/BPB-VPN-$VERSION-windows-x64
          mkdir -p "$out/tor" "$out/resources/geo"
          cp -r build/windows/x64/runner/Release/* "$out/"
          cp core/build/bpbcore.exe core/build/psiphon.exe "$out/"
          cp wintun/bin/amd64/wintun.dll "$out/"
          cp tor-bundle/tor/tor.exe tor-bundle/tor/pluggable_transports/lyrebird.exe "$out/tor/"
          cp android/app/src/main/assets/psiphon_config.json "$out/resources/"
          mkdir -p "$out/resources/tor"
          cp tor-bundle/tor/pluggable_transports/pt_config.json "$out/resources/tor/"
          cp android/app/src/main/assets/geoip.dat android/app/src/main/assets/geosite.dat "$out/resources/geo/"
          cp tor-bundle/data/geoip "$out/resources/geo/tor_geoip"
          cp tor-bundle/data/geoip6 "$out/resources/geo/tor_geoip6"
          # A smoke test: the bundled core reports itself.
          "$out/bpbcore.exe" version

      - name: Build the Setup installer (Inno Setup)
        run: |
          rm -rf build/staged && cp -r "build/BPB-VPN-$VERSION-windows-x64" build/staged
          sed -i "s/#define MyAppVersion \".*\"/#define MyAppVersion \"$VERSION\"/" installer/installer.iss
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" installer/installer.iss
          cp "build/staged/Output/BPB-VPN-Setup-$VERSION-windows-x64.exe" build/

      - name: Zip the portable bundle
        run: |
          cd build
          powershell -Command "Compress-Archive -Path 'BPB-VPN-$env:VERSION-windows-x64' -DestinationPath 'bpb-$VERSION-windows-x64.zip' -Force"
          sha256sum "bpb-$VERSION-windows-x64.zip" "BPB-VPN-Setup-$VERSION-windows-x64.exe" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            build/bpb-*-windows-x64.zip
            build/BPB-VPN-Setup-*-windows-x64.exe
            build/SHA256SUMS.txt

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.prerelease
        uses: softprops/action-gh-release@v2
        with:
          name: BPB VPN ${{ env.VERSION }} for Windows
          files: |
            build/bpb-*-windows-x64.zip
            build/BPB-VPN-Setup-*-windows-x64.exe
            build/SHA256SUMS.txt
          draft: false
          prerelease: ${{ inputs.prerelease || false }}
          body_path: RELEASE_NOTES-WINDOWS.md
